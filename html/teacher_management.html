<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý giảng viên</title>

  <link rel="stylesheet" href="../css/student.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/pop_upadd.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      width: 400px;
    }
    .modal-content input {
      width: 100%;
      margin: 10px 0;
      padding: 8px;
    }
    .modal-content button {
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header class="header">
  <div class="menu-icon" onclick="toggleSidebar()">
    <i class="fas fa-bars"></i>
  </div>
  <div class="logo">Trường Đại học ABC</div>
  <div class="profile-pic">
    <img src="https://i.pravatar.cc/100?img=5" alt="Avatar">
  </div>
  
</header>

<aside class="sidebar" id="sidebar">
  <ul>
    <li><a href="#">Chính sách</a></li>
    <li><a href="#">Giới thiệu</a></li>
    <li><a href="#">FAQ</a></li>
  </ul>
</aside>

<div class="container">
  <div class="page-header">
      <h2>Danh sách giảng viên</h2>
  </div>

  <div class="page-actions">
    <div class="search">
      <input name="search" placeholder="Tìm kiếm theo tên, email giảng viên">
    </div>
    <div class="actions">
      <button class="btn" onclick="openModal()">Thêm mới</button>
      <button class="btn" onclick="downloadFile()">Import giảng viên</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Mã giảng viên</th>
        <th>Họ tên</th>
        <th>Khoa</th>
        <th>Email</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="studentTable">
      <!-- Dữ liệu tự động đổ ra đây -->
    </tbody>
  </table>
</div>

<!-- Popup Form -->
<div class="modal" id="studentModal">
  <div class="modal-content">
    <h3>Thêm mới giảng viên</h3>

    <input type="text" id="lecturerName" placeholder="Họ tên giảng viên">
    <input type="email" id="lecturerEmail" placeholder="Email">
    <input type="tel" id="lecturerPhone" placeholder="Số điện thoại">
    <input type="date" id="lecturerDOB" placeholder="Ngày sinh">

    <select id="lecturerGender">
      <option value="">Chọn giới tính</option>
      <option value="Male">Nam</option>
      <option value="Female">Nữ</option>
      <option value="Other">Khác</option>
    </select>

    <input type="text" id="lecturerAddress" placeholder="Địa chỉ cư trú">
    <select id="lecturerStatus">
      <option value="">Khoa</option>
      <option value="Active">CNTT</option>
      <option value="On Leave">Nghỉ phép</option>
      <option value="Retired">Nghỉ hưu</option>
    </select>


    <select id="lecturerStatus">
      <option value="">Chức vụ</option>
      <option value="Active">Giáo vụ</option>
      <option value="On Leave">Nghỉ phép</option>
      <option value="Retired">Nghỉ hưu</option>
    </select>
    <select id="lecturerStatus">
      <option value="">Học vị</option>
      <option value="Active">GS</option>
      <option value="On Leave">Nghỉ phép</option>
      <option value="Retired">Nghỉ hưu</option>
    </select>
    <input type="date" id="lecturerHireDate" placeholder="Ngày bắt đầu làm việc">

    <select id="lecturerStatus">
      <option value="">Trạng thái công tác</option>
      <option value="Active">Đang làm việc</option>
      <option value="On Leave">Nghỉ phép</option>
      <option value="Retired">Nghỉ hưu</option>
    </select>

    <textarea id="lecturerBio" placeholder="Giới thiệu ngắn về giảng viên"></textarea>

    <div class="action">
      <button onclick="saveLecturer()">Lưu</button>
      <button onclick="closeModal()">Hủy</button>
    </div>
  </div>
</div>

  

<script>
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('active');
}

const students = [
  { id: 'GV001', name: 'Đỗ Thị Hồng Nhung', class: 'CNTT', email: 'dthnhung12k25@gmail.com' },
  { id: 'GV002', name: 'Đỗ Thị Hồng Nhung', class: 'CNTT', email: 'dthnhung12k25@gmail.com' },
  { id: 'GV003', name: 'Đỗ Thị Hồng Nhung', class: 'CNTT', email: 'dthnhung12k25@gmail.com' },
  { id: 'GV004', name: 'Đỗ Thị Hồng Nhung', class: 'CNTT', email: 'dthnhung12k25@gmail.com' }
];

function renderTable() {
  const table = document.getElementById('studentTable');
  table.innerHTML = '';
  students.forEach((student, index) => {
    table.innerHTML += `
      <tr>
        <td>${student.id}</td>
        <td>${student.name}</td>
        <td>${student.class}</td>
        <td>${student.email}</td>
        <td>
          <i class="fas fa-edit" onclick="editStudent(${index})"></i>
          <i class="fas fa-trash-alt" onclick="deleteStudent(${index})"></i>
        </td>
      </tr>
    `;
  });
}

function openModal() {
  document.getElementById('studentModal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('studentModal').style.display = 'none';
  clearForm();
}

function clearForm() {
  document.getElementById('studentId').value = '';
  document.getElementById('studentName').value = '';
  document.getElementById('studentClass').value = '';
  document.getElementById('studentEmail').value = '';
}

function saveStudent() {
  const id = document.getElementById('studentId').value;
  const name = document.getElementById('studentName').value;
  const className = document.getElementById('studentClass').value;
  const email = document.getElementById('studentEmail').value;

  if (id && name && className && email) {
    students.push({ id, name, class: className, email });
    renderTable();
    closeModal();
  } else {
    alert('Vui lòng nhập đầy đủ thông tin.');
  }
}

function editStudent(index) {
  const student = students[index];
  const name = prompt('Sửa tên:', student.name);
  const className = prompt('Sửa lớp:', student.class);
  const email = prompt('Sửa email:', student.email);
  if (name && className && email) {
    students[index] = { ...student, name, class: className, email };
    renderTable();
  }
}

function deleteStudent(index) {
  if (confirm('Bạn có chắc chắn muốn xóa giảng viên này?')) {
    students.splice(index, 1);
    renderTable();
  }
}

function downloadFile() {
  let csvContent = "data:text/csv;charset=utf-8,";
  csvContent += "Mã SV,Họ tên,Lớp,Email\n";
  students.forEach(student => {
    csvContent += `${student.id},${student.name},${student.class},${student.email}\n`;
  });

  const encodedUri = encodeURI(csvContent);
  const link = document.createElement('a');
  link.setAttribute('href', encodedUri);
  link.setAttribute('download', 'danh_sach_sinh_vien.csv');
  document.body.appendChild(link);
  link.click();
}

renderTable();
</script>

</body>
</html>
