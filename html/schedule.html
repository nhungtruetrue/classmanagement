<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý khóa học</title>

  <link rel="stylesheet" href="../css/student.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/subject.css">
  <link rel="stylesheet" href="../css/tab.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content label {
    margin-bottom: 5px;
    margin-top: 5x;
  
  }
  
    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      width: 400px;
    }
    .modal-content input {
      width: 100%;
      margin: 10px 0;
      padding: 8px;
    }
    .modal-content button {
      margin-top: 10px;
    }
    h3{
      color: navy;
      margin-bottom: 10px ;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header class="header">
  <div class="menu-icon" onclick="toggleSidebar()">
    <i class="fas fa-bars"></i>
  </div>
  <div class="logo">Trường Đại học ABC</div>
  <div class="profile-pic">
    <img src="https://i.pravatar.cc/100?img=5" alt="Avatar">
  </div>
  
</header>

<aside class="sidebar" id="sidebar">
  <ul>
    <li><a href="#">Chính sách</a></li>
    <li><a href="#">Giới thiệu</a></li>
    <li><a href="#">FAQ</a></li>
  </ul>
</aside>

<div class="container">
  <div class="page-header">
      <h2>Quản lý khóa học/HKI/Thiết kế web</h2>
  </div>

  <div class="tab-bar">
    <div class="tab-item active">Quản lý lớp học</div>
    <div class="tab-item">Thông tin chung</div>
  </div>
  
  <div class="separator"></div> 
  <h3>Thiết kế web</h3>
  <div class="page-actions">
    
    <div class="search">
      <input name="search" placeholder="Tìm kiếm theo tên giảng viên">
    </div>
    <div class="actions">
      <button class="btn" onclick="openModal()">Thêm mới</button>
    </div>
  </div>

  <table  >
    <thead>
      <tr>
        <th>STT</th>
        <th>Giảng viên</th>
        <th>Ca</th>
        <th>Thứ</th>
        <th>Số lượng sinh viên</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="classSessionTable">
      <!-- Dữ liệu tự động đổ ra đây -->
    </tbody>
  </table>
</div>

<!-- Popup Form -->
<div class="modal" id="courseModal">
  <div class="modal-content">
    <h3>Thêm mới lịch học</h3>
 <label> Môn học:</label> Thiết kế web <br>
    <label for="lecturerSelect">Chọn giảng viên</label>
    <select id="lecturerSelect">
      <option value="">-- Chọn giảng viên --</option>
      <option value="Nguyễn Văn A">Nguyễn Nhật Ánh</option>
      <option value="Trần Thị B">Trần Thị B</option>
      <option value="Lê Văn C">Lê Văn C</option>
    </select>

    <label for="shiftSelect">Ca học</label>
    <select id="shiftSelect">
      <option value="">-- Chọn ca học --</option>
      <option value="Sáng">1</option>
      <option value="Chiều">Chiều</option>
      <option value="Tối">Tối</option>
    </select>

    <label for="weekdaySelect">Thứ</label>
    <select id="weekdaySelect">
      <option value="">-- Chọn thứ --</option>
      <option value="Thứ 2">Thứ 2</option>
      <option value="Thứ 3">Thứ 3</option>
      <option value="Thứ 4">Thứ 4</option>
      <option value="Thứ 5">Thứ 5</option>
      <option value="Thứ 6">Thứ 6</option>
      <option value="Thứ 7">Thứ 7</option>
      <option value="Chủ Nhật">Chủ Nhật</option>
    </select>

    <div class="action">
      <button onclick="saveSchedule()">Lưu</button>
      <button onclick="closeModal()">Hủy</button>
    </div>
  </div>
</div>



  

<script>
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('active');
}
const classSessions = [
  { index: 1, lecturer: 'Nguyễn Nhật Ánh', shift: '1',mon:'Thứ 2', studentCount: '30/60' },
  {  index: 2,lecturer: 'Nguyễn Nhật Ánh', shift: '2',mon:'Thứ 2', studentCount: '30/60' },
  { index: 3, lecturer: 'Nguyễn Nhật Ánh', shift: '4',mon:'Thứ 2', studentCount: '30/60' },
  {  index: 4,lecturer: 'Nguyễn Nhật Ánh', shift: '1',mon:'Thứ 2', studentCount: '30/60' }
];

function renderTable() {
  const table = document.getElementById('classSessionTable');
  table.innerHTML = '';

  classSessions.forEach((session, i) => {
    table.innerHTML += `
      <tr>
        <td>${session.index}</td>
        <td>${session.lecturer}</td>
        <td>${session.shift}</td>
    
        <td>${session.mon}</td>
        <td>${session.studentCount}</td>
        <td>
          <i class="fas fa-edit" onclick="editCourse(${i})"></i>
          <i class="fas fa-trash-alt" onclick="deleteCourse(${i})"></i>
        </td>
      </tr>
    `;
  });
}


function openModal() {
  document.getElementById('courseModal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('courseModal').style.display = 'none';
  clearForm();
}

function clearForm() {
  document.getElementById('studentId').value = '';
  document.getElementById('studentName').value = '';
  document.getElementById('studentClass').value = '';
  document.getElementById('studentEmail').value = '';
}

function saveStudent() {
  const id = document.getElementById('studentId').value;
  const name = document.getElementById('studentName').value;
  const className = document.getElementById('studentClass').value;
  const email = document.getElementById('studentEmail').value;

  if (id && name && className && email) {
    students.push({ id, name, class: className, email });
    renderTable();
    closeModal();
  } else {
    alert('Vui lòng nhập đầy đủ thông tin.');
  }
}

function editStudent(index) {
  const student = students[index];
  const name = prompt('Sửa tên:', student.name);
  const className = prompt('Sửa lớp:', student.class);
  const email = prompt('Sửa email:', student.email);
  if (name && className && email) {
    students[index] = { ...student, name, class: className, email };
    renderTable();
  }
}

function deleteStudent(index) {
  if (confirm('Bạn có chắc chắn muốn xóa sinh viên này?')) {
    students.splice(index, 1);
    renderTable();
  }
}

function downloadFile() {
  let csvContent = "data:text/csv;charset=utf-8,";
  csvContent += "Mã SV,Họ tên,Lớp,Email\n";
  students.forEach(student => {
    csvContent += `${student.id},${student.name},${student.class},${student.email}\n`;
  });

  const encodedUri = encodeURI(csvContent);
  const link = document.createElement('a');
  link.setAttribute('href', encodedUri);
  link.setAttribute('download', 'danh_sach_sinh_vien.csv');
  document.body.appendChild(link);
  link.click();
}

renderTable();
</script>

</body>
</html>
