<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý khóa học</title>

  <link rel="stylesheet" href="../css/student.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/subject.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      width: 400px;
    }
    .modal-content input {
      width: 100%;
      margin: 10px 0;
      padding: 8px;
    }
    .modal-content button {
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header class="header">
  <div class="menu-icon" onclick="toggleSidebar()">
    <i class="fas fa-bars"></i>
  </div>
  <div class="logo">Trường Đại học ABC</div>
  <div class="profile-pic">
    <img src="https://i.pravatar.cc/100?img=5" alt="Avatar">
  </div>
  
</header>

<aside class="sidebar" id="sidebar">
  <ul>
    <li><a href="#">Chính sách</a></li>
    <li><a href="#">Giới thiệu</a></li>
    <li><a href="#">FAQ</a></li>
  </ul>
</aside>

<div class="container">
  <div class="page-header">
      <h2>Danh sách khóa học</h2>
  </div>

  <div class="page-actions">
    <div class="search">
      <input name="search" placeholder="Tìm kiếm theo tên khóa học">
    </div>
    <div class="actions">
      <button class="btn" onclick="openModal()">Thêm mới</button>
    </div>
  </div>

  <table >
    <thead>
      <tr>
        <th>Khóa học</th>
        <th>Ngày bắt đầu </th>
        <th>Ngày kết thúc</th>
        <th>Trạng thái khóa học</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="courseTable">
      <!-- Dữ liệu tự động đổ ra đây -->
    </tbody>
  </table>
</div>

<!-- Popup Form -->
<div class="modal" id="courseModal">
  <div class="modal-content">
    <h3>Thêm mới khóa học</h3>

    <label for="courseName">Tên khóa học</label>
    <input type="text" id="courseName" placeholder="Nhập tên khóa học">

    <label for="startDate">Ngày bắt đầu</label>
    <input type="date" id="startDate">

    <label for="endDate">Ngày kết thúc</label>
    <input type="date" id="endDate">

    <label for="courseStatusSwitch">Trạng thái khóa học</label>
    <div class="switch-container">
      <label class="switch">
        <input type="checkbox" id="courseStatusSwitch" onchange="updateCourseStatus()">
        <span class="slider round"></span>
      </label>
      <span id="courseStatusLabel">Mở đăng ký</span>
    </div>
    
    <div class="action">
      <button onclick="saveCourse()">Lưu</button>
      <button onclick="closeModal()">Hủy</button>
    </div>
  </div>
</div>


  

<script>
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('active');
}
const courses = [
  { name: 'HK I', startDate: '2025-05-01', endDate: '2025-08-01', status: 'Mở đăng ký' },
  { name: 'HK II', startDate: '2025-06-15', endDate: '2025-09-15', status: 'Đóng đăng ký' },
  { name: 'HK III', startDate: '2025-07-01', endDate: '2025-10-01', status: 'Đã kết thúc' },
  { name: 'HK I', startDate: '2025-05-01', endDate: '2025-08-01', status: 'Mở đăng ký' },
  { name: 'HK II', startDate: '2025-06-15', endDate: '2025-09-15', status: 'Đóng đăng ký' },
  { name: 'HK III', startDate: '2025-07-01', endDate: '2025-10-01', status: 'Đã kết thúc' }
];

function renderTable() {
  const table = document.getElementById('courseTable');
  table.innerHTML = ''; // Clear bảng trước

  courses.forEach((course, index) => {
    table.innerHTML += `
      <tr>
        <td>${course.name}</td>
        <td>${course.startDate}</td>
        <td>${course.endDate}</td>
        <td>${course.status}</td>
        <td>
          <i class="fas fa-edit" onclick="editCourse(${index})"></i>
          <i class="fas fa-trash-alt" onclick="deleteCourse(${index})"></i>
        </td>
      </tr>
    `;
  });
}


function openModal() {
  document.getElementById('courseModal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('courseModal').style.display = 'none';
  clearForm();
}

function clearForm() {
  document.getElementById('studentId').value = '';
  document.getElementById('studentName').value = '';
  document.getElementById('studentClass').value = '';
  document.getElementById('studentEmail').value = '';
}

function saveStudent() {
  const id = document.getElementById('studentId').value;
  const name = document.getElementById('studentName').value;
  const className = document.getElementById('studentClass').value;
  const email = document.getElementById('studentEmail').value;

  if (id && name && className && email) {
    students.push({ id, name, class: className, email });
    renderTable();
    closeModal();
  } else {
    alert('Vui lòng nhập đầy đủ thông tin.');
  }
}

function editStudent(index) {
  const student = students[index];
  const name = prompt('Sửa tên:', student.name);
  const className = prompt('Sửa lớp:', student.class);
  const email = prompt('Sửa email:', student.email);
  if (name && className && email) {
    students[index] = { ...student, name, class: className, email };
    renderTable();
  }
}

function deleteStudent(index) {
  if (confirm('Bạn có chắc chắn muốn xóa sinh viên này?')) {
    students.splice(index, 1);
    renderTable();
  }
}

function downloadFile() {
  let csvContent = "data:text/csv;charset=utf-8,";
  csvContent += "Mã SV,Họ tên,Lớp,Email\n";
  students.forEach(student => {
    csvContent += `${student.id},${student.name},${student.class},${student.email}\n`;
  });

  const encodedUri = encodeURI(csvContent);
  const link = document.createElement('a');
  link.setAttribute('href', encodedUri);
  link.setAttribute('download', 'danh_sach_sinh_vien.csv');
  document.body.appendChild(link);
  link.click();
}

renderTable();
</script>

</body>
</html>
