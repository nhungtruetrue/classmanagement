<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Header với Sidebar</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/header.css" />
  <style>
    .profile-pic {
      position: relative;
      display: inline-block;
      cursor: pointer;
    }

    .profile-pic img {
      border-radius: 50%;
      width: 40px;
      height: 40px;
    }

    .logout-btn {
      display: none;
      position: absolute;
      top: 45px;
      right: 0;
      background-color: white;
      border: 1px solid #ccc;
      padding: 8px 12px;
      border-radius: 5px;
      font-size: 14px;
      white-space: nowrap;
      z-index: 999;
    }

    .profile-pic:hover .logout-btn {
      display: block;
    }

    .logout-btn a {
      text-decoration: none;
      color: #333;
    }

    .logout-btn a:hover {
      color: red;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="menu-icon" onclick="toggleSidebar()">
      <i class="fas fa-bars"></i>
    </div>
    <div class="logo">Trường Đại học ABC</div>
    <div class="profile-pic">
      <img src="https://i.pravatar.cc/40" alt="Avatar" />
      <div class="logout-btn"><a href="login.html">Đăng xuất</a></div>
    </div>
  </header>

  <aside class="sidebar" id="sidebar">
    <ul>
      <li><a href="student_management.php">Quản lý sinh viên</a></li>
      <li><a href="teacher_management.php">Quản lý giảng viên</a></li>
      <li><a href="subject_management.php">Quản lý môn học</a></li>
      <li><a href="course_management.php">Quản lý khóa học</a></li>
      <li><a href="account_management.php">Quản lý tài khoản</a></li>
    </ul>
  </aside>

  <script>
    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("active");
    }
  </script>

</body>
</html>
